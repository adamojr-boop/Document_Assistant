[project]
name = "document-assistant"
version = "0.1.0"
description = "Rag assistant"
authors = [
    {name = "Mizzoni Adamo Junior",email = "adamojr@outlook.it"}
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "chainlit (>=2.12.0,<3.0.0)",
    "langchain (>=1.4.3,<2.0.0)",
    "langchain-openai (>=1.6.7,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "langchain-core (>=1.6.6,<2.0.0)",
    "markitdown (>=0.1.8,<0.2.0)",
    "numpy (>=1.26.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"